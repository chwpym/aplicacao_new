<!-- Keyword Cleanup Manager -->
<!DOCTYPE html>
<html class="light" lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Keyword Cleanup Manager</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Material+Icons+Round&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#3b82f6", // Vibrant blue
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                    },
                },
            },
        };
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
        }
    </style>
</head>

<body
    class="bg-slate-200 dark:bg-slate-950 min-h-screen flex items-center justify-center p-4 transition-colors duration-200">
    <div
        class="w-full max-w-2xl bg-background-light dark:bg-background-dark rounded-xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden flex flex-col max-h-[90vh]">
        <div
            class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-white dark:bg-slate-900/50">
            <div class="flex items-center gap-3">
                <span class="material-icons-round text-primary">cleaning_services</span>
                <h1 class="text-lg font-semibold text-slate-800 dark:text-slate-100">Gerenciar Palavras para Remover
                </h1>
            </div>
            <button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                <span class="material-icons-round">close</span>
            </button>
        </div>
        <div class="p-6 flex-1 overflow-y-auto custom-scrollbar">
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-600 dark:text-slate-400 mb-2"
                    for="field-select">Campo de dados</label>
                <div class="relative">
                    <select
                        class="w-full pl-4 pr-10 py-2.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all appearance-none"
                        id="field-select">
                        <option value="marca">Marca</option>
                        <option value="modelo">Modelo</option>
                        <option value="motor">Motor</option>
                        <option value="combustivel">Combustível</option>
                    </select>
                    <span
                        class="material-icons-round absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
                </div>
            </div>
            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-500">
                        Palavras/Frases Cadastradas</h2>
                    <span class="text-xs text-slate-400">11 itens</span>
                </div>
                <div
                    class="bg-slate-50 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden">
                    <ul class="divide-y divide-slate-200 dark:divide-slate-800">
                        <li
                            class="group flex items-center justify-between px-4 py-3 hover:bg-white dark:hover:bg-slate-800/50 transition-colors">
                            <span class="text-sm text-slate-700 dark:text-slate-300 font-medium">SOHC L3</span>
                            <button
                                class="opacity-0 group-hover:opacity-100 p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-md transition-all">
                                <span class="material-icons-round text-sm">delete_outline</span>
                            </button>
                        </li>
                        <li
                            class="group flex items-center justify-between px-4 py-3 hover:bg-white dark:hover:bg-slate-800/50 transition-colors">
                            <span class="text-sm text-slate-700 dark:text-slate-300 font-medium">SOHC L4</span>
                            <button
                                class="opacity-0 group-hover:opacity-100 p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-md transition-all">
                                <span class="material-icons-round text-sm">delete_outline</span>
                            </button>
                        </li>
                        <li
                            class="group flex items-center justify-between px-4 py-3 hover:bg-white dark:hover:bg-slate-800/50 transition-colors">
                            <span class="text-sm text-slate-700 dark:text-slate-300 font-medium">DOHC L3</span>
                            <button
                                class="opacity-0 group-hover:opacity-100 p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-md transition-all">
                                <span class="material-icons-round text-sm">delete_outline</span>
                            </button>
                        </li>
                        <li
                            class="group flex items-center justify-between px-4 py-3 hover:bg-white dark:hover:bg-slate-800/50 transition-colors">
                            <span class="text-sm text-slate-700 dark:text-slate-300 font-medium">EA111</span>
                            <button
                                class="opacity-0 group-hover:opacity-100 p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-md transition-all">
                                <span class="material-icons-round text-sm">delete_outline</span>
                            </button>
                        </li>
                        <li
                            class="group flex items-center justify-between px-4 py-3 hover:bg-white dark:hover:bg-slate-800/50 transition-colors">
                            <span class="text-sm text-slate-700 dark:text-slate-300 font-medium">1800</span>
                            <button
                                class="opacity-0 group-hover:opacity-100 p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-md transition-all">
                                <span class="material-icons-round text-sm">delete_outline</span>
                            </button>
                        </li>
                        <li
                            class="group flex items-center justify-between px-4 py-3 hover:bg-white dark:hover:bg-slate-800/50 transition-colors">
                            <span class="text-sm text-slate-700 dark:text-slate-300 font-medium">OHV L4</span>
                            <button
                                class="opacity-0 group-hover:opacity-100 p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-md transition-all">
                                <span class="material-icons-round text-sm">delete_outline</span>
                            </button>
                        </li>
                        <li
                            class="group flex items-center justify-between px-4 py-3 hover:bg-white dark:hover:bg-slate-800/50 transition-colors">
                            <span class="text-sm text-slate-700 dark:text-slate-300 font-medium">102cv</span>
                            <button
                                class="opacity-0 group-hover:opacity-100 p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-md transition-all">
                                <span class="material-icons-round text-sm">delete_outline</span>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="px-6 py-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50">
            <div class="flex gap-3">
                <div class="flex-1 relative">
                    <input
                        class="w-full px-4 py-2.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all"
                        placeholder="Nova palavra ou frase..." type="text" />
                </div>
                <button
                    class="bg-primary hover:bg-blue-600 text-white px-6 py-2.5 rounded-lg font-medium flex items-center gap-2 shadow-sm transition-all active:scale-95">
                    <span class="material-icons-round text-sm">add</span>
                    Adicionar
                </button>
            </div>
        </div>
        <div
            class="px-6 py-4 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
            <button
                class="text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 text-sm font-medium transition-colors flex items-center gap-1">
                <span class="material-icons-round text-base">help_outline</span>
                Ajuda
            </button>
            <div class="flex gap-3">
                <button
                    class="px-6 py-2 border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-400 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors font-medium">
                    Cancelar
                </button>
                <button
                    class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-2 rounded-lg font-semibold shadow-md shadow-emerald-900/10 transition-all active:scale-95 flex items-center gap-2">
                    <span class="material-icons-round text-sm">check_circle</span>
                    Salvar e Fechar
                </button>
            </div>
        </div>
    </div>
    <div class="fixed bottom-6 right-6 flex flex-col gap-2">
        <button
            class="p-3 bg-white dark:bg-slate-800 text-slate-800 dark:text-white rounded-full shadow-lg border border-slate-200 dark:border-slate-700 hover:scale-110 transition-transform"
            onclick="document.documentElement.classList.toggle('dark')">
            <span class="material-icons-round dark:hidden">dark_mode</span>
            <span class="material-icons-round hidden dark:block">light_mode</span>
        </button>
    </div>

</body>

</html>
